name: Tibo 中文微信与邮件通知

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "发送一封最新真实帖子的中文测试邮件"
        type: boolean
        default: false
      send_test_pushplus:
        description: "向自己的微信发送一条最新真实帖子的中文测试通知"
        type: boolean
        default: false
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: reset-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTIFY_ALL_POSTS: "true"
      TRANSLATE_ZH: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SOURCE_PROVIDER: ${{ vars.SOURCE_PROVIDER || 'fxembed' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_USERNAME: ${{ vars.X_USERNAME || 'thsottiaux' }}
      MATCH_WORD: ${{ vars.MATCH_WORD || 'reset' }}
      X_EXCLUDE_REPLIES: ${{ vars.X_EXCLUDE_REPLIES || 'false' }}
      BOOTSTRAP_NOTIFY: "false"
      TARGET_TIMEZONE: ${{ vars.TARGET_TIMEZONE || 'Asia/Shanghai' }}
      SOURCE_TIMEZONE: ${{ vars.SOURCE_TIMEZONE }}
      INCLUDE_MENTIONS: ${{ vars.INCLUDE_MENTIONS || 'true' }}
      WEBHOOK_DEBUG: ${{ vars.WEBHOOK_DEBUG || 'false' }}
      STATE_PATH: runtime/state.json
      PUBLIC_STATUS_PATH: runtime/status.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      SMS_TO: ${{ secrets.SMS_TO }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Checkout isolated runtime state
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: runtime
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run monitor
        id: monitor
        run: npm run monitor
      - name: Send Chinese test email
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_email
        run: node --import tsx src/test-email.ts
      - name: Send Chinese WeChat test notification
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_pushplus
        run: node --import tsx src/test-pushplus.ts
      - name: Publish GitHub Actions summary
        if: always() && steps.monitor.outcome != 'skipped'
        run: node scripts/actions-summary.mjs
      - name: Persist runtime state even after notification failure
        id: persist
        if: always() && steps.monitor.outcome != 'skipped'
        working-directory: runtime
        run: |
          if [ -z "$(git status --porcelain -- state.json status.json feed.xml)" ]; then
            exit 0
          fi
          git config user.name "reset-signal[bot]"
          git config user.email "reset-signal[bot]@users.noreply.github.com"
          git add state.json status.json feed.xml
          git commit -m "chore: update monitor runtime state"
          git pull --rebase origin monitor-state
          git push origin HEAD:monitor-state
      - name: Keep recovery checkpoint if runtime persistence failed
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-recovery
          path: |
            runtime/state.json
            runtime/status.json
            runtime/feed.xml
          retention-days: 7
